services:
  # 1. SkillBridge Centralized Backend (Node/Express/Socket.IO)
  - type: web
    name: skillbridge-backend
    env: node
    plan: starter # $7/mo - Always On (No cold starts / sleep), 0.5 CPU, 512MB RAM
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://skillbridge-campus.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Optional 3rd-party OAuth & Storage (can be updated later in Render Dashboard):
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://skillbridge-backend-15a7.onrender.com/api/v1/auth/google/callback
      - key: GITHUB_CLIENT_ID
        value: placeholder
      - key: GITHUB_CLIENT_SECRET
        value: placeholder
      - key: GITHUB_CALLBACK_URL
        value: https://skillbridge-backend-15a7.onrender.com/api/v1/auth/github/callback
      - key: LINKEDIN_CLIENT_ID
        value: placeholder
      - key: LINKEDIN_CLIENT_SECRET
        value: placeholder
      - key: LINKEDIN_CALLBACK_URL
        value: https://skillbridge-backend-15a7.onrender.com/api/v1/auth/linkedin/callback
      # Cloud Object Storage:
      - key: CLOUDINARY_CLOUD_NAME
        value: placeholder
      - key: CLOUDINARY_API_KEY
        value: placeholder
      - key: CLOUDINARY_API_SECRET
        value: placeholder

  # 2. SkillBridge Frontend Static Site
  - type: web
    name: skillbridge-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://skillbridge-backend-15a7.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://skillbridge-backend-15a7.onrender.com

# 3. Managed PostgreSQL Database
databases:
  - name: skillbridge-postgres
    plan: 0.5c-1g # $7/mo Render Flexible Compute: 0.5 CPU, 1GB RAM, persistent storage, automated daily backups
    databaseName: skillbridge
    user: skillbridge_user
