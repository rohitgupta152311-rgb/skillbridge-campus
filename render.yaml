services:
  # 1. SkillBridge Centralized Backend (Node/Express/Socket.IO)
  - type: web
    name: skillbridge-backend
    env: node
    plan: starter # $7/mo - Always On (No cold starts / sleep), 0.5 CPU, 512MB RAM
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://skillbridge-campus.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Configure in Render Dashboard for OAuth:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://skillbridge-backend.onrender.com/api/v1/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://skillbridge-backend.onrender.com/api/v1/auth/github/callback
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CALLBACK_URL
        value: https://skillbridge-backend.onrender.com/api/v1/auth/linkedin/callback
      # Cloud Object Storage:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 2. SkillBridge Frontend Static Site
  - type: static
    name: skillbridge-frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://skillbridge-backend.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://skillbridge-backend.onrender.com

# 3. Managed PostgreSQL Database
databases:
  - name: skillbridge-postgres
    plan: starter # $7/mo - Persistent storage (never expires in 30 days), automated daily backups, 1GB RAM, 250GB bandwidth
    databaseName: skillbridge
    user: skillbridge_user
