name: SkillBridge CI/CD - Web & Backend Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Test & Build Centralized Backend
  # ───────────────────────────────────────────────
  backend-ci:
    name: Backend Lint, Test & TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/skillbridge_test?schema=public"
      JWT_SECRET: "test_jwt_secret_for_ci_environment_2026"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile TypeScript
        run: npm run build

      - name: Run Test Suite
        run: npm test

  # ───────────────────────────────────────────────
  # Job 2: Test & Build React Vite Web Frontend
  # ───────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint & Production Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_URL: "https://skillbridge-backend-15a7.onrender.com/api/v1"

  # ───────────────────────────────────────────────
  # Job 3: Automated Render Deployment
  # ───────────────────────────────────────────────
  deploy-render:
    name: Trigger Render Production Deployment
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Render Deploy Hook (Backend)
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render Backend Web Service deploy..."
            curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not configured. Skipping automated deploy hook."
          fi

      - name: Dispatch Render Deploy Hook (Web)
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render Static Site deploy..."
            curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK not configured. Skipping automated deploy hook."
          fi
