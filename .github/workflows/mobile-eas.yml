name: SkillBridge Mobile - EAS Build & OTA Update

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'EAS Channel to publish to (e.g. production, preview)'
        required: true
        default: 'production'

jobs:
  # ───────────────────────────────────────────────
  # Automated Over-The-Air (OTA) Updates
  # ───────────────────────────────────────────────
  publish-ota-update:
    name: Publish Instant EAS OTA Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Dependencies
        run: npm install

      - name: Publish EAS Update to Channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            CHANNEL="${{ github.event.inputs.release_channel || 'production' }}"
            echo "Publishing automated OTA update to channel: $CHANNEL"
            eas update --auto --channel "$CHANNEL" --message "CI/CD automated update: ${{ github.sha }}"
          else
            echo "EXPO_TOKEN secret not configured. Skipping EAS update publish."
          fi
